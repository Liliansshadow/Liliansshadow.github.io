<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岳麓流年 · 中南大学 · 长沙岳麓区</title>

  <!-- Leaflet：多 CDN 容错加载（jsDelivr / bootcdn 有国内节点，速度快） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';" />
  <script>
    // 依次尝试多个 CDN 加载 Leaflet，加载成功后启动地图
    (function () {
      var CDNS = [
        'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
        'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
        'https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.js',
        'https://cdn.staticfile.org/leaflet/1.9.4/leaflet.min.js'
      ];
      function boot() {
        if (window.__campusMapStarted) return;
        window.__campusMapStarted = true;
        startCampusMap();
      }
      function load(i) {
        if (i >= CDNS.length) return;
        var s = document.createElement('script');
        s.src = CDNS[i];
        s.onload = boot;
        s.onerror = function () { load(i + 1); };
        document.head.appendChild(s);
      }
      load(0);
    })();
  </script>

  <style>
    /* ============ 基础重置 ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ============ 顶部信息卡片（毛玻璃） ============ */
    .hero-card {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 1000;
      max-width: 320px;
      padding: 16px 20px;
      border-radius: 20px;
      background: rgba(245, 240, 255, 0.65);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 8px 32px rgba(139, 116, 190, 0.25);
      color: #4b3a6b;
    }
    .hero-card h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
      background: linear-gradient(120deg, #8b6ec7, #b79ce0);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-card.hidden { display: none; }
    .hero-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: rgba(167, 139, 218, 0.25);
      color: #7a5fb0;
      font-size: 14px;
      line-height: 26px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      padding: 0;
    }
    .hero-close:hover { background: rgba(167, 139, 218, 0.45); transform: rotate(90deg); }

    /* 重新展开卡片的小按钮（关闭后出现在左下角） */
    .hero-restore {
      position: absolute;
      left: 18px;
      bottom: 26px;
      z-index: 1000;
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: rgba(245, 240, 255, 0.7);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 20px rgba(139, 116, 190, 0.28);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      color: #8b6ec7;
      display: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .hero-restore:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 10px 26px rgba(139, 116, 190, 0.4);
      background: rgba(240, 234, 255, 0.9);
    }
    .hero-restore.show { display: block; animation: pop-in 0.25s ease; }
    .hero-card p {
      font-size: 12.5px;
      line-height: 1.7;
      color: #6f5b94;
    }
    .hero-card .badge {
      display: inline-block;
      margin: 8px 6px 0 0;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      background: rgba(167, 139, 218, 0.25);
      color: #7a5fb0;
      border: 1px solid rgba(167, 139, 218, 0.35);
    }

    /* ============ 右下角标记统计 ============ */
    .counter-chip {
      position: absolute;
      right: 18px;
      bottom: 26px;
      z-index: 1000;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(245, 240, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 6px 24px rgba(139, 116, 190, 0.22);
      font-size: 13px;
      color: #6f5b94;
      font-weight: 600;
      pointer-events: none;
    }
    .counter-chip strong { color: #8b6ec7; font-size: 16px; }

    /* ============ 底图切换控件（毛玻璃） ============ */
    .bs-control {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 14px;
      background: rgba(245, 240, 255, 0.7);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 20px rgba(139, 116, 190, 0.25);
      font-family: inherit;
    }
    .bs-btn {
      border: none;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: #7a5fb0;
      background: transparent;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .bs-btn:hover { background: rgba(167, 139, 218, 0.18); }
    .bs-btn.active {
      background: linear-gradient(120deg, #9d7fd4, #b79ce0);
      color: #fff;
      box-shadow: 0 4px 12px rgba(139, 110, 199, 0.4);
    }

    /* ============ 手绘地图叠加 ============ */
    .overlay-btn-wrap {
      display: flex;
      padding: 4px;
      border-radius: 14px;
      background: rgba(245, 240, 255, 0.7);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 20px rgba(139, 116, 190, 0.25);
      position: relative;
      z-index: 1100;   /* 保证按钮在面板之上，始终可点击关闭 */
    }
    .overlay-btn {
      border: none;
      padding: 5px 9px;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      background: transparent;
      transition: background 0.2s ease;
    }
    .overlay-btn:hover { background: rgba(167, 139, 218, 0.18); }

    .overlay-panel {
      position: absolute;
      top: 176px;
      right: 18px;
      z-index: 1001;
      width: 250px;
      padding: 16px 16px 14px;
      border-radius: 18px;
      background: rgba(250, 247, 255, 0.88);
      backdrop-filter: blur(16px) saturate(150%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 16px 44px rgba(100, 72, 160, 0.32);
      color: #4b3a6b;
      display: none;
    }
    .overlay-panel.show { display: block; animation: pop-in 0.25s ease; }
    .overlay-panel-title { font-size: 14px; font-weight: 800; margin-bottom: 12px; }
    .overlay-btn-main {
      width: 100%;
      padding: 10px 0;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(120deg, #9d7fd4, #b79ce0);
      color: #fff;
      box-shadow: 0 6px 16px rgba(139, 110, 199, 0.35);
      font-family: inherit;
      margin-bottom: 10px;
    }
    .overlay-btn-main.danger { background: linear-gradient(120deg, #d48a8a, #c96b6b); box-shadow: 0 6px 16px rgba(201,107,107,.3); }
    .overlay-row { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; font-size: 12.5px; }
    .overlay-row input[type="range"] { flex: 1; accent-color: #8b6ec7; }
    .overlay-row button { flex: 1; margin-bottom: 0; }
    .overlay-hint { font-size: 11px; color: #a394bd; line-height: 1.7; margin-top: 4px; }
    .overlay-status { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 10px; padding: 7px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 600; background: rgba(167,139,218,.12); color: #6f5b94; }
    .overlay-status.cloud { background: rgba(90,170,220,.14); color: #2f7fae; }

    /* ============ 昵称输入 ============ */
    .nickname-label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 8px; color: #6f5b94; }
    .nickname-input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(167, 139, 218, 0.45);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #4b3a6b;
      background: rgba(255, 255, 255, 0.7);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .nickname-input:focus { border-color: #8b6ec7; box-shadow: 0 0 0 3px rgba(139,110,199,.18); }
    .nickname-input::placeholder { color: #b3a5cb; }
    .form-hint { font-size: 11px; color: #a394bd; margin-top: 6px; }

    /* ============ 管理员入口按钮 ============ */
    .admin-btn {
      position: absolute;
      right: 18px;
      bottom: 84px;
      z-index: 1000;
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: rgba(245, 240, 255, 0.7);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 20px rgba(139, 116, 190, 0.28);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      color: #8b6ec7;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .admin-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 26px rgba(139,116,190,.4); background: rgba(240,234,255,.9); }

    /* ============ 审核面板 ============ */
    .review-panel { max-width: 520px; width: 92%; max-height: 82vh; display: flex; flex-direction: column; }
    .review-panel .modal-card { max-height: 82vh; display: flex; flex-direction: column; }
    .review-title { font-size: 14px; font-weight: 800; color: #4b3a6b; }
    .review-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-top: 14px; padding-right: 4px; }
    .review-item {
      display: flex; gap: 12px; align-items: flex-start;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(167, 139, 218, 0.25);
      border-radius: 14px; padding: 10px;
    }
    .review-item img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
    .review-item .no-img { width: 64px; height: 64px; border-radius: 10px; background: rgba(167,139,218,.12); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .review-info { flex: 1; min-width: 0; }
    .review-info .nick { font-weight: 700; color: #5b4890; font-size: 13px; }
    .review-info .desc { font-size: 12px; color: #6f5b94; margin: 3px 0; word-break: break-word; }
    .review-info .time { font-size: 11px; color: #a394bd; }
    .review-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .review-actions button { border: none; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .review-approve { background: rgba(90, 170, 120, 0.16); color: #2e7d50; }
    .review-approve:hover { background: rgba(90, 170, 120, 0.28); }
    .review-reject { background: rgba(214, 108, 108, 0.16); color: #b04141; }
    .review-reject:hover { background: rgba(214, 108, 108, 0.28); }
    .review-empty { text-align: center; color: #a394bd; padding: 24px 0; font-size: 13px; }

    /* ============ 弹窗中的发布者/状态 ============ */
    .popup-nick { font-weight: 700; color: #6f5b94; font-size: 13px; }
    .popup-status { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; background: rgba(90,170,120,.16); color: #2e7d50; }
    .popup-meta span { display: block; }
    /* 手绘图叠加层元素 */
    .campus-overlay-img { z-index: 400; }
    .campus-overlay-corner {
      z-index: 500; width: 16px; height: 16px; border-radius: 50%;
      background: #fff; border: 3px solid #9d7fd4;
      box-shadow: 0 0 0 3px rgba(157,127,212,.28); cursor: move;
    }
    .campus-overlay-rotate {
      z-index: 500; width: 20px; height: 20px; border-radius: 50%;
      background: #fff; border: 3px solid #e08fbf;
      box-shadow: 0 0 0 3px rgba(224,143,191,.3); cursor: grab;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #c96b6b; line-height: 1;
    }
    .campus-overlay-rotate::after { content: '↻'; }
    .overlay-row button#overlayResetRot { flex: 0 0 auto; width: 30px; height: 30px; border: none; border-radius: 8px; background: rgba(167,139,218,.18); color: #6f5b94; font-size: 15px; cursor: pointer; }
    .overlay-row button#overlayResetRot:hover { background: rgba(167,139,218,.3); }

    /* ============ 表单弹窗（毛玻璃） ============ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(88, 66, 128, 0.25);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .modal-overlay.show { display: flex; }

    .modal-card {
      width: min(92vw, 420px);
      border-radius: 24px;
      padding: 26px 26px 24px;
      background: rgba(250, 247, 255, 0.82);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 24px 60px rgba(100, 72, 160, 0.35);
      color: #4b3a6b;
      animation: pop-in 0.25s ease;
    }
    @keyframes pop-in {
      from { transform: translateY(14px) scale(0.97); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }

    .modal-card h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .modal-card .coords {
      font-size: 12px;
      color: #8b79ad;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal-card .coords .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #b79ce0;
      display: inline-block;
    }

    /* 上传照片区域 */
    .upload-zone {
      border: 2px dashed rgba(167, 139, 218, 0.55);
      border-radius: 16px;
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(231, 220, 250, 0.4);
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    .upload-zone:hover { border-color: #8b6ec7; background: rgba(231, 220, 250, 0.6); }
    .upload-zone .icon { font-size: 30px; display: block; margin-bottom: 6px; }
    .upload-zone .tip { font-size: 13px; color: #6f5b94; }
    .upload-zone .sub { font-size: 11.5px; color: #a394bd; margin-top: 4px; }
    .upload-zone.has-photo { border-style: solid; padding: 8px; }
    .upload-zone img.preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      display: none;
    }
    .upload-zone.has-photo .preview { display: block; margin-bottom: 8px; }
    .upload-zone.has-photo .icon,
    .upload-zone.has-photo .tip,
    .upload-zone.has-photo .sub { display: none; }
    .upload-zone .remove-photo {
      display: none;
      position: absolute;
      top: 14px; right: 14px;
      width: 26px; height: 26px;
      border-radius: 50%;
      border: none;
      background: rgba(90, 60, 140, 0.8);
      color: #fff;
      font-size: 15px;
      line-height: 26px;
      cursor: pointer;
    }
    .upload-zone.has-photo .remove-photo { display: block; }

    /* 描述输入 */
    .desc-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #6f5b94;
    }
    .desc-input {
      width: 100%;
      min-height: 84px;
      resize: vertical;
      border: 1px solid rgba(167, 139, 218, 0.45);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #4b3a6b;
      background: rgba(255, 255, 255, 0.7);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .desc-input:focus {
      border-color: #8b6ec7;
      box-shadow: 0 0 0 3px rgba(139, 110, 199, 0.18);
    }
    .desc-input::placeholder { color: #b3a5cb; }
    .char-count { text-align: right; font-size: 11px; color: #a394bd; margin-top: 4px; }

    /* 按钮 */
    .btn-row { display: flex; gap: 12px; margin-top: 18px; }
    .btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-cancel { background: rgba(167, 139, 218, 0.2); color: #7a5fb0; }
    .btn-cancel:hover { background: rgba(167, 139, 218, 0.32); }
    .btn-save {
      background: linear-gradient(120deg, #9d7fd4, #b79ce0);
      color: #fff;
      box-shadow: 0 8px 20px rgba(139, 110, 199, 0.4);
    }
    .btn-save:hover { box-shadow: 0 10px 26px rgba(139, 110, 199, 0.55); }
    .btn-save:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ============ Leaflet 弹窗（毛玻璃） ============ */
    .campus-popup .leaflet-popup-content-wrapper {
      border-radius: 18px;
      background: rgba(250, 247, 255, 0.78);
      backdrop-filter: blur(16px) saturate(150%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 16px 44px rgba(100, 72, 160, 0.35);
      color: #4b3a6b;
      font-family: inherit;
    }
    .campus-popup .leaflet-popup-tip {
      background: rgba(250, 247, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .campus-popup .leaflet-popup-content { margin: 14px 16px; line-height: 1.6; }

    .popup-photo {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
      display: block;
    }
    .popup-no-photo {
      width: 100%;
      height: 96px;
      border-radius: 12px;
      background: linear-gradient(135deg, #efe6fd, #e0d2f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b79ad;
      font-size: 13px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .popup-desc { font-size: 14px; color: #4b3a6b; white-space: pre-wrap; word-break: break-word; }
    .popup-empty-desc { font-size: 13px; color: #a394bd; font-style: italic; }
    .popup-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(167, 139, 218, 0.4);
      font-size: 11px;
      color: #a394bd;
    }
    .delete-marker {
      border: none;
      background: transparent;
      color: #c0392b;
      font-size: 11.5px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.2s;
      font-family: inherit;
    }
    .delete-marker:hover { background: rgba(192, 57, 43, 0.12); }

    /* ============ 图钉标记动画 ============ */
    .pin-wrap { position: relative; width: 34px; height: 42px; filter: drop-shadow(0 6px 10px rgba(90, 60, 140, 0.35)); }
    .pin-wrap svg { display: block; animation: pin-drop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes pin-drop {
      0%   { transform: translateY(-26px) scale(0.7); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .pin-wrap::after {
      content: "";
      position: absolute;
      left: 50%; bottom: 0;
      width: 14px; height: 5px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(90, 60, 140, 0.35);
      filter: blur(2px);
      animation: shadow-fade 0.4s ease;
    }
    @keyframes shadow-fade {
      0% { opacity: 0; transform: translateX(-50%) scale(0.4); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }

  <!-- 审核面板 -->
  <div class="modal-overlay" id="reviewOverlay">
    <div class="modal-card review-panel">
      <h2>🔑 内容审核</h2>
      <div class="coords"><span class="dot"></span>待审核标记（通过后展示给所有访客）</div>
      <div class="review-list" id="reviewList"></div>
      <div class="btn-row">
        <button class="btn btn-cancel" id="reviewClose" type="button">关闭</button>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
       岳麓流年 · 中南大学（长沙岳麓区）
       中心坐标: GCJ-02 28.127849, 112.828249（岳麓区质心，圆覆盖全区）
       底图: 高德地图（默认，国内可访问）/ OpenStreetMap（可切换）
       由上方 CDN 加载器在 Leaflet 就绪后调用 startCampusMap()
       ============================================================ */
    function startCampusMap() {

    /* ---------- 坐标转换 WGS-84 <-> GCJ-02 ----------
       高德/腾讯等国内底图使用 GCJ-02（火星坐标），
       OpenStreetMap 使用 WGS-84。切换底图时需互相转换。 */
    var PI = Math.PI;
    var A = 6378245.0;
    var EE = 0.00669342162296594323;

    function outOfChina(lng, lat) {
      return (lng < 72.004 || lng > 137.8347) || (lat < 0.8293 || lat > 55.8271);
    }
    function transformLat(x, y) {
      var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
      ret += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
      return ret;
    }
    function transformLng(x, y) {
      var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
      ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
      return ret;
    }
    // WGS-84 -> GCJ-02，返回 [lng, lat]
    function wgs84ToGcj02(lng, lat) {
      if (outOfChina(lng, lat)) return [lng, lat];
      var dLat = transformLat(lng - 105.0, lat - 35.0);
      var dLng = transformLng(lng - 105.0, lat - 35.0);
      var radLat = lat / 180.0 * PI;
      var magic = Math.sin(radLat);
      magic = 1 - EE * magic * magic;
      var sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
      dLng = (dLng * 180.0) / (A / sqrtMagic * Math.cos(radLat) * PI);
      return [lng + dLng, lat + dLat];
    }
    // GCJ-02 -> WGS-84（迭代逼近更精确），返回 [lng, lat]
    function gcj02ToWgs84(lng, lat) {
      if (outOfChina(lng, lat)) return [lng, lat];
      var g = wgs84ToGcj02(lng, lat);
      var wgs = [lng * 2 - g[0], lat * 2 - g[1]];
      for (var i = 0; i < 4; i++) {
        var gg = wgs84ToGcj02(wgs[0], wgs[1]);
        wgs[0] -= (gg[0] - lng);
        wgs[1] -= (gg[1] - lat);
      }
      return wgs;
    }
    // 将 (lat,lng) 从 fromCrs 转到 toCrs，返回 [lat, lng]
    function convertLatLng(lat, lng, fromCrs, toCrs) {
      if (fromCrs === toCrs) return [lat, lng];
      var wgsLng, wgsLat;
      if (fromCrs === 'gcj02') {
        var w = gcj02ToWgs84(lng, lat);
        wgsLng = w[0]; wgsLat = w[1];
      } else {
        wgsLng = lng; wgsLat = lat;
      }
      if (toCrs === 'gcj02') {
        var g = wgs84ToGcj02(wgsLng, wgsLat);
        return [g[1], g[0]];
      }
      return [wgsLat, wgsLng];
    }

    /* ---------- 底图配置 ---------- */
    var PROVIDERS = {
      amap: {
        name: '高德地图',
        crs: 'gcj02',
        url: 'https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}',
        subdomains: ['1', '2', '3', '4'],
        attr: '&copy; 高德地图'
      },
      osm: {
        name: 'OpenStreetMap',
        crs: 'wgs84',
        url: 'https://tile.openstreetmap.de/{z}/{x}/{y}.png',
        subdomains: 'abc',
        attr: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }
    };
    var DEFAULT_PROVIDER = 'amap';
    var CURRENT_PROVIDER = DEFAULT_PROVIDER;

    /* ---------- 常量 ---------- */
    // 岳麓区中心（按默认高德 / GCJ-02 坐标系解释；圆圈覆盖整个岳麓区）
    var GCJ_CENTER = [28.127849, 112.828249];
    var RANGE_M      = 22500;              // 覆盖半径约 22.5 km（包含整个岳麓区）
    var STORAGE_KEY  = 'yueluLiumianMarkers';
    var MIN_ZOOM     = 10;
    var MAX_ZOOM     = 19;
    var DEFAULT_ZOOM = 11;

    // 学校中心的 WGS-84 坐标（统一存储基准）
    var WGS_CENTER = (function () {
      var w = gcj02ToWgs84(GCJ_CENTER[1], GCJ_CENTER[0]);
      return [w[1], w[0]];
    })();

    function currentCrs() { return PROVIDERS[CURRENT_PROVIDER].crs; }

    // 当前底图坐标系下的显示中心（保证切换底图时同一物理位置）
    function displayCenter() {
      return convertLatLng(WGS_CENTER[0], WGS_CENTER[1], 'wgs84', currentCrs());
    }

    // 依据当前底图坐标系计算拖拽范围
    function computeBounds() {
      var c = displayCenter();
      var dLat = RANGE_M / 111000;
      var dLng = RANGE_M / (111000 * Math.cos(c[0] * PI / 180));
      return L.latLngBounds([c[0] - dLat, c[1] - dLng], [c[0] + dLat, c[1] + dLng]);
    }

    function createTileLayer(key) {
      var p = PROVIDERS[key];
      return L.tileLayer(p.url, {
        subdomains: p.subdomains,
        maxZoom: MAX_ZOOM,
        attribution: p.attr
      });
    }

    /* ---------- Supabase 云端共享（审核制） ----------
       在 https://supabase.com 注册并创建项目后：
       1. 项目 URL 与 anon/publishable 密钥在项目里点「API Keys / Copy project URL and API keys」查看；
       2. 把 URL 和 anonKey 填到下方，enabled 改为 true；
       3. 在 SQL 编辑器执行以下建表语句（含匿名读写权限）：
         create table if not exists public.yuelu_markers (
           id uuid primary key default gen_random_uuid(),
           latitude double precision not null,
           longitude double precision not null,
           image text,
           description text,
           nickname text not null,
           password text not null default '1234',
           status text not null default 'pending',
           created_at timestamptz not null default now()
         );
         alter table public.yuelu_markers enable row level security;
         create policy "yuelu_markers_public_read" on public.yuelu_markers for select using (true);
         create policy "yuelu_markers_public_insert" on public.yuelu_markers for insert with check (true);
         create policy "yuelu_markers_public_update" on public.yuelu_markers for update using (true) with check (true);
         create policy "yuelu_markers_public_delete" on public.yuelu_markers for delete using (true);
       说明：标记坐标统一按 WGS-84 存储，展示时自动转换到当前底图坐标系。
       status 取值：pending（待审核）/ approved（已通过）/ rejected（已拒绝）。 */
    var SUPABASE_CONFIG = {
      enabled: true,                                  // 已启用云端共享
      url: 'https://endjjlgwgsgtyvevdifv.supabase.co',
      anonKey: 'sb_publishable_DOUeDQzGr2qwfG20s-lYCg_vhvSk7Qa'
    };
    var SB_TABLE = 'yuelu_markers';                    // 数据表名（岳麓流年专用）
    var ADMIN_PASSWORD = 'admin123';                   // 管理员审核密码

    function sbConfigured() {
      var c = SUPABASE_CONFIG;
      var urlOk = /^https:\/\/[^/]+\/\/?$/.test(c.url + '/') && c.url.indexOf('supabase.co') !== -1;
      return !!c.enabled &&
        urlOk &&
        c.anonKey && c.anonKey.indexOf('在此填入') === -1 && c.anonKey.length > 20;
    }

    function sbRequest(method, path, body) {
      var c = SUPABASE_CONFIG;
      return fetch(c.url.replace(/\/+$/, '') + '/rest/v1' + path, {
        method: method,
        headers: {
          'apikey': c.anonKey,
          'Authorization': 'Bearer ' + c.anonKey,
          'Content-Type': 'application/json',
          'Prefer': (method === 'POST' || method === 'PATCH') ? 'return=representation' : 'return=minimal'
        },
        body: body ? JSON.stringify(body) : undefined
      }).then(function (r) {
        if (r.status === 204) return {};
        return r.json().catch(function () { return {}; }).then(function (data) {
          if (!r.ok) {
            throw new Error((data && (data.message || data.error)) || ('云端请求失败 HTTP ' + r.status));
          }
          return data;
        });
      });
    }

    // 新增记录（status 默认 pending），返回带 id 的记录
    function sbCreate(marker) {
      return sbRequest('POST', '/' + SB_TABLE, {
        latitude: marker.lat,
        longitude: marker.lng,
        image: marker.photo || '',
        description: marker.description || '',
        nickname: marker.nickname || '',
        password: marker.password || '1234',
        status: marker.status || 'pending'
      });
    }

    // 更新状态（审核通过/拒绝）
    function sbUpdateStatus(cloudId, status) {
      return sbRequest('PATCH', '/' + SB_TABLE + '?id=eq.' + encodeURIComponent(cloudId), {
        status: status
      });
    }

    function sbDelete(cloudId) {
      return sbRequest('DELETE', '/' + SB_TABLE + '?id=eq.' + encodeURIComponent(cloudId));
    }

    /* ---------- 初始化地图 ---------- */
    var map = L.map('map', {
      center: displayCenter(),
      zoom: DEFAULT_ZOOM,
      minZoom: MIN_ZOOM,
      maxZoom: MAX_ZOOM,
      zoomControl: false,
      maxBounds: computeBounds(),
      maxBoundsViscosity: 1.0,
      attributionControl: true
    });
    L.control.zoom({ position: 'topright' }).addTo(map);

    var tileLayer = createTileLayer(CURRENT_PROVIDER).addTo(map);

    // 岳麓区范围示意圆 + 中心点
    var rangeCircle, centerDot;
    function addOverlays() {
      var c = displayCenter();
      rangeCircle = L.circle(c, {
        radius: RANGE_M,
        color: '#9d7fd4',
        weight: 2,
        dashArray: '6 6',
        fillColor: '#e0d2f7',
        fillOpacity: 0.12
      }).addTo(map);
      centerDot = L.marker(c, {
        icon: L.divIcon({
          className: '',
          html: '<div style="width:14px;height:14px;border-radius:50%;background:#8b6ec7;border:3px solid #fff;box-shadow:0 0 0 4px rgba(139,110,199,.25);"></div>',
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        }),
        interactive: false
      }).addTo(map);
    }
    addOverlays();

    /* ---------- 底图切换控件 ---------- */
    var switcherControl = L.control({ position: 'topright' });
    switcherControl.onAdd = function () {
      var div = L.DomUtil.create('div', 'bs-control leaflet-bar');
      var html = '';
      Object.keys(PROVIDERS).forEach(function (k) {
        html += '<button class="bs-btn' + (k === CURRENT_PROVIDER ? ' active' : '') +
                '" data-provider="' + k + '" type="button">' + PROVIDERS[k].name + '</button>';
      });
      div.innerHTML = html;
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    };
    switcherControl.addTo(map);

    function switchProvider(key) {
      if (!PROVIDERS[key] || key === CURRENT_PROVIDER) return;
      CURRENT_PROVIDER = key;

      // 换底图
      map.removeLayer(tileLayer);
      tileLayer = createTileLayer(key).addTo(map);

      // 重设范围与中心（保持同一物理位置）
      map.setMaxBounds(computeBounds());
      map.setView(displayCenter(), map.getZoom(), { animate: false });

      // 重绘范围圆与中心点
      map.removeLayer(rangeCircle);
      map.removeLayer(centerDot);
      addOverlays();

      // 重绘所有标记（转换到新坐标系；未通过审核的不显示）
      Object.keys(markers).forEach(function (id) {
        var m = markers[id];
        if (!m.leafletMarker) return;
        var p = convertLatLng(m.lat, m.lng, m.crs, currentCrs());
        m.leafletMarker.setLatLng(p);
      });

      // 重绘手绘地图叠加（保持同一物理位置）
      if (overlayImage && overlayWGS) {
        drawOverlay(overlayImage, overlayWGS, overlayOpacity, overlayVisible);
      }

      // 更新按钮状态
      document.querySelectorAll('.bs-btn').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-provider') === key);
      });
    }

    // 切换按钮事件委托
    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.bs-btn');
      if (btn) switchProvider(btn.getAttribute('data-provider'));
    });

    /* ---------- 图钉标记图标 ---------- */
    function pinIcon() {
      return L.divIcon({
        className: '',
        html: '<div class="pin-wrap">' +
                '<svg width="34" height="42" viewBox="0 0 36 46" xmlns="http://www.w3.org/2000/svg">' +
                  '<defs>' +
                    '<linearGradient id="pinGrad" x1="0" y1="0" x2="1" y2="1">' +
                      '<stop offset="0%" stop-color="#a78bdc"/>' +
                      '<stop offset="100%" stop-color="#8b6ec7"/>' +
                    '</linearGradient>' +
                  '</defs>' +
                  '<path d="M18 2 C9 2 3 9.2 3 17.4 C3 28 18 44 18 44 C18 44 33 28 33 17.4 C33 9.2 27 2 18 2 Z" fill="url(#pinGrad)" stroke="#fff" stroke-width="1.5"/>' +
                  '<circle cx="18" cy="17.4" r="6.4" fill="#fff" opacity="0.95"/>' +
                  '<circle cx="18" cy="17.4" r="3.4" fill="#b79ce0"/>' +
                '</svg>' +
              '</div>',
        iconSize: [34, 42],
        iconAnchor: [17, 42],
        popupAnchor: [0, -40]
      });
    }

    /* ---------- 数据读写（本地缓存 + 云端共享） ---------- */
    var markers = {};

    function localLoad() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function localSave() {
      try {
        var list = Object.keys(markers).map(function (id) {
          var m = markers[id];
          return {
            id: m.id, lat: m.lat, lng: m.lng,
            photo: m.photo, description: m.description, nickname: m.nickname,
            password: m.password, status: m.status, createdAt: m.createdAt, cloudId: m.cloudId
          };
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {
        console.warn('本地缓存写入失败', e);
      }
    }

    function setSyncStatus(text) {
      var el = document.getElementById('syncBadge');
      if (el) el.textContent = text;
    }

    // 云端行 → 前端标记对象（坐标统一按 WGS-84 存储）
    function rowToMarker(row) {
      return {
        id: row.id,
        cloudId: row.id,
        lat: row.latitude,
        lng: row.longitude,
        photo: row.image || null,
        description: row.description || '',
        nickname: row.nickname || '',
        password: row.password || '1234',
        status: row.status || 'pending',
        createdAt: Date.parse(row.created_at) || Date.now()
      };
    }

    // 加载标记：只显示 status = approved 的
    function loadMarkers() {
      if (!sbConfigured()) {
        // 未配置云端：使用本地数据
        setSyncStatus('💾 本地模式');
        localLoad().forEach(function (item) {
          if (item.status !== 'approved') return;
          addMarker(item, false);
        });
        updateCount();
        return;
      }
      // 已配置云端：以云端为共享数据源（仅拉取已通过）
      setSyncStatus('☁️ 正在同步…');
      sbRequest('GET', '/' + SB_TABLE + '?status=eq.approved&select=*&order=created_at.asc&limit=1000')
        .then(function (rows) {
          var list = (rows || []).map(rowToMarker);
          list.forEach(function (item) { addMarker(item, false); });
          updateCount();
          setSyncStatus('☁️ 云端共享 · ' + list.length + ' 条');
        })
        .catch(function (err) {
          console.warn('云端读取失败，回退本地缓存', err);
          setSyncStatus('⚠️ 云端不可用 · 本地模式');
          localLoad().forEach(function (item) {
            if (item.status !== 'approved') return;
            addMarker(item, false);
          });
          updateCount();
        });
    }

    function formatTime(ts) {
      var d = new Date(ts);
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
             ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function buildPopupHtml(m) {
      var html = '';
      if (m.photo) {
        html += '<img class="popup-photo" src="' + m.photo + '" alt="校园照片" />';
      } else {
        html += '<div class="popup-no-photo">🌸 这里没有照片</div>';
      }
      if (m.description && m.description.trim()) {
        html += '<div class="popup-desc">' + escapeHtml(m.description) + '</div>';
      } else {
        html += '<div class="popup-empty-desc">（没有留下文字）</div>';
      }
      var statusText = m.status === 'approved' ? '已通过'
                     : (m.status === 'rejected' ? '已拒绝' : '待审核');
      html += '<div class="popup-meta">' +
                '<span class="popup-nick">👤 发布者：' + escapeHtml(m.nickname || '匿名') + '</span>' +
                '<span><span class="popup-status">' + statusText + '</span></span>' +
                '<span>🕐 ' + formatTime(m.createdAt) + '</span>' +
                '<button class="delete-marker" data-id="' + m.id + '" type="button">🗑 删除</button>' +
              '</div>';
      return html;
    }

    // 添加标记：仅 approved 显示在地图；新增默认 pending 不显示（等待审核）
    function addMarker(m, persist) {
      m.crs = 'wgs84'; // 统一基准
      var display = m.status === 'approved';
      var marker = null;
      if (display) {
        var p = convertLatLng(m.lat, m.lng, 'wgs84', currentCrs());
        marker = L.marker(p, { icon: pinIcon() }).addTo(map);

        marker.bindPopup(buildPopupHtml(m), {
          className: 'campus-popup',
          maxWidth: 300,
          minWidth: 220,
          offset: [0, -8]
        });

        // 点击标记只开弹窗，不触发地图点击
        marker.on('click', function (e) {
          L.DomEvent.stopPropagation(e.originalEvent);
        });
        m.leafletMarker = marker;
      } else {
        m.leafletMarker = null;
      }

      markers[m.id] = m;

      if (persist !== false) {
        localSave();
        // 云端模式：把新标记同步到 Supabase（status=pending）
        if (sbConfigured() && !m.cloudId) {
          sbCreate(m).then(function (res) {
            var created = Array.isArray(res) ? res[0] : res;
            if (created && created.id && markers[m.id]) {
              markers[m.id].cloudId = created.id;
              localSave();
            }
          }).catch(function (err) {
            console.warn('云端保存失败', err);
            setSyncStatus('⚠️ 云端保存失败 · 仅存本地');
          });
        }
      }
      updateCount();
      return marker;
    }

    function removeMarker(id) {
      var m = markers[id];
      if (!m) return;
      // 云端模式：同步删除云端记录
      if (sbConfigured() && m.cloudId) {
        sbDelete(m.cloudId).catch(function (err) {
          console.warn('云端删除失败', err);
          setSyncStatus('⚠️ 云端删除失败');
        });
      }
      if (m.leafletMarker) map.removeLayer(m.leafletMarker);
      delete markers[id];
      localSave();
      updateCount();
    }

    function compressImage(file, maxSize, quality) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function (e) {
          var img = new Image();
          img.onload = function () {
            var w = img.width, h = img.height;
            if (Math.max(w, h) > maxSize) {
              var ratio = maxSize / Math.max(w, h);
              w = Math.round(w * ratio);
              h = Math.round(h * ratio);
            }
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    /* ---------- 手绘地图叠加（上传自定义卡通地图） ---------- */
    var overlayImage = null;              // 图片 dataURL
    var overlayLayer = null;              // 图片 DOM（img）
    var overlaySWEl = null, overlayNEEl = null; // 两个角点拖拽元素
    var overlayRotateEl = null;           // 旋转手柄
    var overlayWGS = null;                // 叠加范围（WGS-84 基准，跨底图保持一致）
    var overlayBounds = null;             // 当前底图坐标系的 L.LatLngBounds
    var overlayOpacity = 0.85;
    var overlayVisible = true;
    var overlayRotation = 0;              // 旋转角度（度，顺时针为正）
    var OVERLAY_KEY = 'yueluLiumianOverlay';
    var overlayPassword = '1234';             // 手绘地图管理密码（更换/删除时校验）
    var IDB_NAME = 'yueluLiumianDB';
    var IDB_STORE = 'files';
    var SB_OVERLAY_TABLE = 'yuelu_overlay';    // 云端手绘图数据表（单行 id='shared'）
    var overlayCloudPushTimer = null;          // 云端推送节流
    var overlayMapListening = false;          // 是否已监听地图移动

    // IndexedDB：存放手绘图（localStorage 放不下大图）
    function idbOpen() {
      return new Promise(function (resolve, reject) {
        var req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = function () {
          if (!req.result.objectStoreNames.contains(IDB_STORE)) {
            req.result.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    }
    function idbPut(key, value) {
      return idbOpen().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(value, key);
          tx.oncomplete = function () { resolve(); };
          tx.onerror = function () { reject(tx.error); };
        });
      });
    }
    function idbGet(key) {
      return idbOpen().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(IDB_STORE, 'readonly');
          var req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      });
    }
    function idbDel(key) {
      return idbOpen().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).delete(key);
          tx.oncomplete = function () { resolve(); };
          tx.onerror = function () { reject(tx.error); };
        });
      });
    }

    // 创建叠加层里的可交互元素（角点/手柄）
    function makeOverlayEl(cls) {
      var el = L.DomUtil.create('div', cls, map.getPanes().overlayPane);
      el.style.position = 'absolute';
      el.style.left = '0';
      el.style.top = '0';
      L.DomEvent.disableClickPropagation(el);
      L.DomEvent.disableScrollPropagation(el);
      return el;
    }

    function removeOverlayLayers() {
      if (overlayLayer) { L.DomUtil.remove(overlayLayer); overlayLayer = null; }
      if (overlaySWEl) { L.DomUtil.remove(overlaySWEl); overlaySWEl = null; }
      if (overlayNEEl) { L.DomUtil.remove(overlayNEEl); overlayNEEl = null; }
      if (overlayRotateEl) { L.DomUtil.remove(overlayRotateEl); overlayRotateEl = null; }
      if (overlayMapListening) {
        map.off('move', onOverlayMapMove);
        map.off('zoomend', onOverlayMapMove);
        overlayMapListening = false;
      }
    }

    // 地图移动/缩放时重算叠加层像素位置
    function onOverlayMapMove() {
      if (overlayLayer && overlayImage && overlayBounds) renderOverlay();
    }

    // 把 WGS-84 角点转到当前底图坐标系
    function wgsToCrsLL(lat, lng) {
      var p = convertLatLng(lat, lng, 'wgs84', currentCrs());
      return L.latLng(p[0], p[1]);
    }

    // 渲染：图片绕中心旋转，角点与手柄跟随旋转
    function renderOverlay() {
      if (!overlayLayer || !overlayImage || !overlayBounds) return;
      var center = map.latLngToLayerPoint(overlayBounds.getCenter());
      var swP = map.latLngToLayerPoint(overlayBounds.getSouthWest());
      var neP = map.latLngToLayerPoint(overlayBounds.getNorthEast());
      var w = Math.abs(neP.x - swP.x);
      var h = Math.abs(neP.y - swP.y);
      var rad = overlayRotation * Math.PI / 180;
      var cos = Math.cos(rad), sin = Math.sin(rad);

      overlayLayer.style.width = w + 'px';
      overlayLayer.style.height = h + 'px';
      overlayLayer.style.transform = 'translate(' + (center.x - w / 2) + 'px,' + (center.y - h / 2) + 'px) rotate(' + overlayRotation + 'deg)';

      function place(el, dx, dy) {
        if (!el) return;
        var rx = dx * cos - dy * sin;
        var ry = dx * sin + dy * cos;
        el.style.transform = 'translate(' + (center.x + rx) + 'px,' + (center.y + ry) + 'px) translate(-50%,-50%)';
      }
      place(overlaySWEl, -w / 2, h / 2);
      place(overlayNEEl, w / 2, -h / 2);
      place(overlayRotateEl, 0, -h / 2 - 30);
    }

    function setOverlayImageOpacity(op) {
      overlayOpacity = op;
      if (overlayLayer) overlayLayer.style.opacity = op;
    }

    function setOverlayVisible(v) {
      overlayVisible = v;
      var items = [overlayLayer, overlaySWEl, overlayNEEl, overlayRotateEl];
      for (var i = 0; i < items.length; i++) {
        if (!items[i]) continue;
        if (v && !items[i].parentNode) map.getPanes().overlayPane.appendChild(items[i]);
        else if (!v && items[i].parentNode) items[i].parentNode.removeChild(items[i]);
      }
    }

    // 统一拖拽（mousedown/mousemove/mouseup）
    function startOverlayDrag(el, onMove, onEnd) {
      var dragging = false;
      L.DomEvent.on(el, 'mousedown', function (e) {
        dragging = true;
        L.DomEvent.stop(e);
        if (map.dragging) map.dragging.disable();
        if (el.style) el.style.cursor = 'grabbing';
        function move(ev) {
          if (!dragging) return;
          onMove(map.mouseEventToLayerPoint(ev));
        }
        function up() {
          if (!dragging) return;
          dragging = false;
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
          if (map.dragging) map.dragging.enable();
          if (el.style) el.style.cursor = '';
          if (onEnd) onEnd();
        }
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
      });
    }

    // 角点拖拽：鼠标位置逆旋转后更新对应角，保持旋转不变
    function bindCornerDrag(el, which) {
      startOverlayDrag(el, function (pt) {
        if (!overlayBounds) return;
        var center = map.latLngToLayerPoint(overlayBounds.getCenter());
        var dx = pt.x - center.x, dy = pt.y - center.y;
        var rad = -overlayRotation * Math.PI / 180; // 逆旋转到未旋转坐标系
        var cos = Math.cos(rad), sin = Math.sin(rad);
        var rx = dx * cos - dy * sin;
        var ry = dx * sin + dy * cos;
        var newLL = map.layerPointToLatLng(L.point(center.x + rx, center.y + ry));
        var sw = overlayBounds.getSouthWest(), ne = overlayBounds.getNorthEast();
        if (which === 'sw') sw = newLL; else ne = newLL;
        overlayBounds = L.latLngBounds(sw, ne);
        renderOverlay();
        syncOverlayWGS(false);
      }, function () { syncOverlayWGS(); });
    }

    // 旋转手柄拖拽：按手柄与中心的角度设置旋转
    function bindRotateDrag(el) {
      startOverlayDrag(el, function (pt) {
        if (!overlayBounds) return;
        var center = map.latLngToLayerPoint(overlayBounds.getCenter());
        var ang = Math.atan2(pt.y - center.y, pt.x - center.x) * 180 / Math.PI;
        overlayRotation = Math.round(ang + 90);
        while (overlayRotation > 180) overlayRotation -= 360;
        while (overlayRotation < -180) overlayRotation += 360;
        renderOverlay();
        syncOverlayWGS(false);
        var rot = document.getElementById('overlayRotation');
        if (rot && rot.value != overlayRotation) rot.value = overlayRotation;
      }, function () { syncOverlayWGS(); });
    }

    // 当前 bounds → WGS-84 并保存
    function syncOverlayWGS(pushCloud) {
      if (!overlayBounds) return;
      var s = overlayBounds.getSouthWest(), n = overlayBounds.getNorthEast();
      var ws = convertLatLng(s.lat, s.lng, currentCrs(), 'wgs84');
      var wn = convertLatLng(n.lat, n.lng, currentCrs(), 'wgs84');
      overlayWGS = { sw: [ws[0], ws[1]], ne: [wn[0], wn[1]] };
      saveOverlayMeta(pushCloud);
    }

    function drawOverlay(url, wgsBounds, opacity, visible) {
      removeOverlayLayers();
      if (!url || !wgsBounds) return;
      var bounds = L.latLngBounds(wgsToCrsLL(wgsBounds.sw[0], wgsBounds.sw[1]),
                                  wgsToCrsLL(wgsBounds.ne[0], wgsBounds.ne[1]));
      overlayBounds = bounds;

      // 图片（CSS transform 旋转，绕中心）
      var img = overlayLayer = L.DomUtil.create('img', 'campus-overlay-img');
      img.src = url;
      img.style.position = 'absolute';
      img.style.left = '0';
      img.style.top = '0';
      img.style.transformOrigin = '50% 50%';
      img.style.pointerEvents = 'none';
      map.getPanes().overlayPane.appendChild(img);
      setOverlayImageOpacity(opacity);

      // 角点 + 旋转手柄
      overlaySWEl = makeOverlayEl('campus-overlay-corner');
      overlayNEEl = makeOverlayEl('campus-overlay-corner');
      overlayRotateEl = makeOverlayEl('campus-overlay-rotate');
      bindCornerDrag(overlaySWEl, 'sw');
      bindCornerDrag(overlayNEEl, 'ne');
      bindRotateDrag(overlayRotateEl);

      renderOverlay();

      if (visible === false) setOverlayVisible(false);

      if (!overlayMapListening) {
        map.on('move', onOverlayMapMove);
        map.on('zoomend', onOverlayMapMove);
        overlayMapListening = true;
      }
    }

    function saveOverlayMeta(pushCloud) {
      if (!overlayImage || !overlayWGS) return;
      try {
        localStorage.setItem(OVERLAY_KEY, JSON.stringify({
          sw: overlayWGS.sw, ne: overlayWGS.ne,
          opacity: overlayOpacity, visible: overlayVisible,
          rotation: overlayRotation,
          password: overlayPassword
        }));
      } catch (e) {}
      // 拖拽过程中只存本地；松手后再推云端
      if (pushCloud !== false) sbOverlayPushDebounced();
    }

    function removeOverlay() {
      overlayImage = null;
      overlayWGS = null;
      overlayBounds = null;
      overlayOpacity = 0.85;
      overlayVisible = true;
      overlayRotation = 0;
      overlayPassword = '1234';
      removeOverlayLayers();
      try { localStorage.removeItem(OVERLAY_KEY); } catch (e) {}
      idbDel('overlayImage');
      updateOverlayPanel();
      // 云端同步删除，让所有访客都看不到
      if (overlayCloudPushTimer) { clearTimeout(overlayCloudPushTimer); overlayCloudPushTimer = null; }
      sbOverlayDelete();
    }

    function loadOverlay() {
      var meta = null;
      try { meta = JSON.parse(localStorage.getItem(OVERLAY_KEY) || 'null'); } catch (e) {}
      var hadLocal = !!(meta && meta.sw && meta.ne && meta.sw.length && meta.ne.length);
      if (hadLocal) {
        overlayWGS = { sw: meta.sw, ne: meta.ne };
        overlayOpacity = (meta.opacity != null) ? meta.opacity : 0.85;
        overlayVisible = (meta.visible !== false);
        overlayRotation = (meta.rotation != null) ? meta.rotation : 0;
        overlayPassword = (meta.password != null && meta.password !== '') ? String(meta.password) : '1234';
        idbGet('overlayImage').then(function (dataURL) {
          if (!dataURL) { // 本地有元数据但图片丢了 → 直接拉云端
            sbLoadOverlay();
            return;
          }
          overlayImage = dataURL;
          drawOverlay(dataURL, overlayWGS, overlayOpacity, overlayVisible);
          updateOverlayPanel();
          // 后台与云端协调：云端有则覆盖（共享真相源），云端空则把本地上传
          sbLoadOverlay().then(function (res) {
            if (res === 'empty') sbOverlayPushNow();
          });
        }).catch(function () { sbLoadOverlay(); });
      } else {
        // 无本地记录 → 直接拉云端
        sbLoadOverlay();
      }
    }

    function updateOverlayPanel() {
      var has = !!overlayImage;
      document.getElementById('overlayControls').style.display = has ? 'block' : 'none';
      document.getElementById('overlayUploadText').textContent = has ? '🔄 换一张' : '📤 上传手绘图';
      var op = document.getElementById('overlayOpacity');
      var v = Math.round(overlayOpacity * 100);
      if (op.value != v) op.value = v;
      var rot = document.getElementById('overlayRotation');
      if (rot && rot.value != overlayRotation) rot.value = overlayRotation;
      document.getElementById('overlayToggle').textContent = overlayVisible ? '🙈 隐藏' : '👁 显示';
      // 更新云端状态（默认显示）
      var st = document.getElementById('overlayStatus');
      if (st && st.textContent === '') {
        setOverlayCloudStatus(sbConfigured());
      }
    }

    // 压缩手绘图（上限 2400px，手绘 PNG 保持清晰）
    function compressOverlayImage(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function (e) {
          var img = new Image();
          img.onload = function () {
            var w = img.width, h = img.height;
            var maxSize = 2400;
            if (Math.max(w, h) > maxSize) {
              var r = maxSize / Math.max(w, h);
              w = Math.round(w * r); h = Math.round(h * r);
            }
            var canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            var isPng = file.type === 'image/png';
            resolve(canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', 0.9));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 从已有 dataURL 压缩（用于云端上传体积控制）
    function compressOverlayDataURL(dataURL, maxSize, quality, forceJpeg) {
      return new Promise(function (resolve, reject) {
        var img = new Image();
        img.onload = function () {
          var w = img.width, h = img.height;
          if (Math.max(w, h) > maxSize) {
            var r = maxSize / Math.max(w, h);
            w = Math.round(w * r); h = Math.round(h * r);
          }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var isPng = !forceJpeg && dataURL.indexOf('data:image/png') === 0;
          resolve(canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = dataURL;
      });
    }

    /* ---------- 手绘图云端共享（所有访客看到同一张） ---------- */
    function sbOverlayUpsert() {
      if (!sbConfigured() || !overlayImage || !overlayWGS) return Promise.resolve(false);
      var payload = {
        id: 'shared',
        image: overlayImage,
        sw_lat: overlayWGS.sw[0], sw_lng: overlayWGS.sw[1],
        ne_lat: overlayWGS.ne[0], ne_lng: overlayWGS.ne[1],
        opacity: overlayOpacity,
        visible: overlayVisible,
        rotation: overlayRotation,
        password: overlayPassword
      };
      var send = function (img) {
        payload.image = img;
        var c = SUPABASE_CONFIG;
        // 用 upsert 语义：主键 id 冲突时更新已有行（需 Prefer: resolution=merge-duplicates）
        return fetch(c.url.replace(/\/+$/, '') + '/rest/v1/' + SB_OVERLAY_TABLE + '?on_conflict=id', {
          method: 'POST',
          headers: {
            'apikey': c.anonKey,
            'Authorization': 'Bearer ' + c.anonKey,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates,return=representation'
          },
          body: JSON.stringify(payload)
        }).then(function (r) {
          if (r.status === 204) return {};
          return r.json().catch(function () { return {}; }).then(function (data) {
            if (!r.ok) throw new Error((data && (data.message || data.error)) || ('云端请求失败 HTTP ' + r.status));
            return data;
          });
        }).then(function () { setOverlayCloudStatus(true); return true; })
          .catch(function () { setOverlayCloudStatus(false); return false; });
      };
      // 图片过大时压缩后再上传（PostgREST 请求体有限制）
      if (payload.image.length > 3000000) {
        return compressOverlayDataURL(payload.image, 1400, 0.82, false)
          .then(function (small) {
            if (small.length > 3000000) return compressOverlayDataURL(payload.image, 1200, 0.8, true);
            return small;
          })
          .then(send)
          .catch(function () { setOverlayCloudStatus(false); return false; });
      }
      return send(payload.image);
    }

    // 高频操作（拖拽/透明度）节流推送
    function sbOverlayPushDebounced() {
      if (!sbConfigured() || !overlayImage || !overlayWGS) return;
      if (overlayCloudPushTimer) clearTimeout(overlayCloudPushTimer);
      overlayCloudPushTimer = setTimeout(function () {
        overlayCloudPushTimer = null;
        sbOverlayUpsert();
      }, 700);
    }

    // 立即推送（上传/删除后马上同步）
    function sbOverlayPushNow() {
      if (overlayCloudPushTimer) { clearTimeout(overlayCloudPushTimer); overlayCloudPushTimer = null; }
      return sbOverlayUpsert();
    }

    // 云端删除手绘图
    function sbOverlayDelete() {
      if (!sbConfigured()) return Promise.resolve(false);
      return sbRequest('DELETE', '/' + SB_OVERLAY_TABLE + '?id=eq.' + encodeURIComponent('shared'))
        .then(function () { setOverlayCloudStatus(true); return true; })
        .catch(function () { return false; });
    }

    // 从云端拉取手绘图；返回 'found' / 'empty' / 'error'
    function sbLoadOverlay() {
      if (!sbConfigured()) return Promise.resolve('error');
      return sbRequest('GET', '/' + SB_OVERLAY_TABLE + '?id=eq.shared&select=*')
        .then(function (rows) {
          if (!rows || !rows.length || !rows[0].image) return 'empty';
          var r = rows[0];
          overlayImage = r.image;
          overlayWGS = { sw: [r.sw_lat, r.sw_lng], ne: [r.ne_lat, r.ne_lng] };
          overlayOpacity = (r.opacity != null) ? r.opacity : 0.85;
          overlayVisible = (r.visible !== false);
          overlayRotation = (r.rotation != null) ? r.rotation : 0;
          overlayPassword = (r.password != null && r.password !== '') ? String(r.password) : '1234';
          idbPut('overlayImage', r.image);
          try {
            localStorage.setItem(OVERLAY_KEY, JSON.stringify({
              sw: overlayWGS.sw, ne: overlayWGS.ne,
              opacity: overlayOpacity, visible: overlayVisible,
              rotation: overlayRotation
            }));
          } catch (e) {}
          drawOverlay(r.image, overlayWGS, overlayOpacity, overlayVisible);
          updateOverlayPanel();
          setOverlayCloudStatus(true);
          return 'found';
        })
        .catch(function () { setOverlayCloudStatus(false); return 'error'; });
    }

    // 面板状态文字
    function setOverlayCloudStatus(ok) {
      var st = document.getElementById('overlayStatus');
      if (!st) return;
      if (!sbConfigured()) {
        st.className = 'overlay-status';
        st.textContent = '💾 仅本地保存（未配置云端）';
      } else if (ok) {
        st.className = 'overlay-status cloud';
        st.textContent = overlayImage ? '☁️ 已共享到云端 · 所有访客可见' : '☁️ 云端共享已开启 · 上传后所有访客可见';
      } else {
        st.className = 'overlay-status';
        st.textContent = '⚠️ 云端同步失败 · 仅本地保存';
      }
    }

    // 右上角手绘控制按钮
    var overlayCtrl = L.control({ position: 'topright' });
    overlayCtrl.onAdd = function () {
      var div = L.DomUtil.create('div', 'overlay-btn-wrap leaflet-bar');
      div.innerHTML = '<button class="overlay-btn" id="overlayBtn" type="button" title="手绘地图">🎨</button>';
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    };
    overlayCtrl.addTo(map);

    document.getElementById('overlayBtn').addEventListener('click', function () {
      var panel = document.getElementById('overlayPanel');
      panel.classList.toggle('show');
      // 打开面板时若尚未初始化状态，则显示云端共享提示
      if (panel.classList.contains('show')) {
        var st = document.getElementById('overlayStatus');
        if (st && st.textContent === '') setOverlayCloudStatus(sbConfigured());
      }
    });
    // 点击面板外部（地图、其他区域）自动关闭面板
    document.addEventListener('mousedown', function (e) {
      var panel = document.getElementById('overlayPanel');
      if (!panel.classList.contains('show')) return;
      if (panel.contains(e.target)) return;
      if (e.target.id === 'overlayBtn') return;
      panel.classList.remove('show');
    });
    document.getElementById('overlayUpload').addEventListener('click', function () {
      // 已有手绘图 → 更换需验证管理密码
      if (overlayImage) {
        var pwd = prompt('请输入手绘地图管理密码（4位数字）：');
        if (pwd === null) return;
        if (pwd.trim() !== String(overlayPassword || '1234')) { alert('密码错误，无法更换手绘地图。'); return; }
      }
      document.getElementById('overlayFileInput').click();
    });
    document.getElementById('overlayFileInput').addEventListener('change', function () {
      var file = this.files && this.files[0];
      if (!file) return;
      if (!/^image\/(png|jpe?g)$/i.test(file.type)) { alert('请上传 PNG / JPG 图片'); return; }
      // 首次上传：设置管理密码；更换时保留原密码（更换前已校验）
      if (!overlayImage) {
        var pwdInput = document.getElementById('overlayPasswordInput');
        var newPwd = pwdInput ? pwdInput.value.trim() : '';
        if (!/^\d{4}$/.test(newPwd)) { alert('请先设置 4 位数字管理密码（用于更换/删除手绘地图）'); if (pwdInput) pwdInput.focus(); this.value = ''; return; }
        overlayPassword = newPwd;
      }
      compressOverlayImage(file).then(function (dataURL) {
        overlayImage = dataURL;
        var c = displayCenter();
        // 默认覆盖大学区域约 4 公里
        var dLat = 0.018, dLng = 0.0204;
        var sw = convertLatLng(c[0] - dLat, c[1] - dLng, currentCrs(), 'wgs84');
        var ne = convertLatLng(c[0] + dLat, c[1] + dLng, currentCrs(), 'wgs84');
        overlayWGS = { sw: [sw[0], sw[1]], ne: [ne[0], ne[1]] };
        overlayOpacity = 0.85;
        overlayVisible = true;
        overlayRotation = 0;   // 换图时旋转归零，便于重新对齐
        drawOverlay(dataURL, overlayWGS, overlayOpacity, overlayVisible);
        idbPut('overlayImage', dataURL);
        saveOverlayMeta();
        updateOverlayPanel();
        sbOverlayPushNow();  // 立即共享到云端
        document.getElementById('overlayPanel').classList.add('show');
      }).catch(function () { alert('图片读取失败，请换一张'); });
    });
    document.getElementById('overlayOpacity').addEventListener('input', function () {
      overlayOpacity = this.value / 100;
      setOverlayImageOpacity(overlayOpacity);
      saveOverlayMeta();
    });
    document.getElementById('overlayRotation').addEventListener('input', function () {
      overlayRotation = parseFloat(this.value) || 0;
      renderOverlay();
      saveOverlayMeta();
    });
    document.getElementById('overlayResetRot').addEventListener('click', function () {
      overlayRotation = 0;
      var rot = document.getElementById('overlayRotation');
      if (rot) rot.value = 0;
      renderOverlay();
      saveOverlayMeta();
    });
    document.getElementById('overlayToggle').addEventListener('click', function () {
      if (!overlayLayer) return;
      setOverlayVisible(!overlayVisible);
      saveOverlayMeta();
      updateOverlayPanel();
    });
    document.getElementById('overlayDelete').addEventListener('click', function () {
      var pwd = prompt('请输入手绘地图管理密码（4位数字）：');
      if (pwd === null) return;
      if (pwd.trim() !== String(overlayPassword || '1234')) { alert('密码错误，无法删除手绘地图。'); return; }
      if (confirm('确定删除手绘地图叠加吗？')) removeOverlay();
    });

    /* ---------- 启动 ---------- */
    loadMarkers();
    loadOverlay();
    }
  </script>
</body>
</html>
